<!doctype html>
<html lang="en">

<title>Level Plain Pro — Email Signature</title>

<body style="margin:0; padding:24px; background:#FAFAF7; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;">

<!--
  LEVEL PLAIN PRO — EMAIL SIGNATURE TEMPLATE
  ============================================
  How to use:
  1. Fill in the [PLACEHOLDER] fields below (name, title, direct line).
  2. Host logo-mark.png somewhere public (e.g. https://levelplainpro.com/assets/logo-mark.png)
     and swap it into the src="" below — most email clients block/strip local file paths
     and inline base64 images, so the logo MUST be loaded from a live URL.
  3. Copy everything inside the <table id="lpp-signature"> ... </table> block below,
     paste it into your email client's signature editor (Gmail: Settings > Signature,
     Outlook: Settings > Mail > Compose and reply > Signatures) using the client's
     "insert as HTML" / rich-text paste, not plain text.
  4. Table layout + inline styles are used throughout because most email clients
     (Outlook especially) strip <style> blocks and ignore flexbox/grid.
-->

<table id="lpp-signature" role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;">
  <tr>
    <!-- Logo -->
    <td style="padding-right:18px; border-right:2px solid #C9A227; vertical-align:middle;">
      <img src="https://levelplainpro.com/assets/logo-mark.png" alt="Level Plain Pro" width="46" height="40" style="display:block; width:46px; height:40px;">
    </td>

    <!-- Name / title / company -->
    <td style="padding-left:18px; vertical-align:middle;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <td style="font-family:Georgia,'Times New Roman',serif; font-size:16px; font-weight:700; color:#1A2B3C; padding-bottom:2px;">
            Ethan Davis
          </td>
        </tr>
        <tr>
          <td style="font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; font-size:12.5px; font-weight:600; color:#2D6A4F; padding-bottom:8px;">
            Financial Recovery Expert &nbsp;·&nbsp; Level Plain Pro
          </td>
        </tr>
        <tr>
          <td style="font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; font-size:12px; color:#5C6877; line-height:1.7;">
            <a href="tel:+12064556551" style="color:#5C6877; text-decoration:none;">+1 206 455 6551</a>
            &nbsp;·&nbsp;
            <a href="mailto:hello@levelplainpro.com" style="color:#5C6877; text-decoration:none;">hello@levelplainpro.com</a>

            700 5th Ave, Seattle, WA 98104, USA
            <br>
            <a href="https://levelplainpro.com" style="color:#C9A227; text-decoration:none; font-weight:600;">levelplainpro.com</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
